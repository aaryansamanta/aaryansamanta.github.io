const facts=[

const ids=["t0","t1","t2"], pts=ids.map(id=>{const m=document.getElementById(id).getAttribute("d").match(/-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?/g).map(p=>p.split(",").map(Number));const b=m[0][1];let mx=0;m.forEach(p=>mx=Math.max(mx,Math.abs(b-p[1])));return{m,b,mx}});

 const draw=[0,4,8].map(d=>Math.min(1,Math.max(0,(f-d)/22)));
 ids.forEach((id,i)=>{const e=document.getElementById(id);e.style.strokeDasharray=1;e.style.strokeDashoffset=1-ease(draw[i])});
 const fadeOut=f>=64?1-(f-64)/8:1;
 document.getElementById("tr").style.opacity=fadeOut;
 const k=Math.floor(f/18), ch=document.getElementById("chip"), fa=facts[k];
 ch.textContent=fa[0]; ch.style.background=fa[1]; ch.style.color=fa[2];
 const w=f%18; ch.style.opacity=1; ch.style.transform="translateY("+(w<2?(2-w)*5:0)+"px)";
 const cur=document.getElementById("cur");
 if(f>=28&&f<64){const q=ease((f-28)/35);const i=Math.round(q*(pts[0].m.length-1));const x=pts[0].m[i][0];
  cur.setAttribute("opacity",fadeOut);document.getElementById("cl").setAttribute("x1",x);document.getElementById("cl").setAttribute("x2",x);

 } else cur.setAttribute("opacity",0);
}
